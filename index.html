/* ===== Tema no estilo do app de relatório (S-21) ===== */
:root{--fundo:#e8f0f8;--escuro:#1d1915;--ouro:#c9a65b;--marrom:#8a5a3b;--verde:#3f7d3f;--azul:#2d5fb4;--cinza:#8d8a86;--borda:#d3dfeb;--card:#fff}
[hidden]{display:none!important}
body{background:var(--fundo);color:var(--escuro);font-family:"DM Sans",Arial,sans-serif}
table,td,th,.btn,.tb,input,select,textarea,.lk,.lk2{font-family:"DM Sans",Arial,sans-serif!important}
.hd{background:var(--escuro);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px 16px}
.hd1{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:600;line-height:1.1}
.hd2{font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-top:4px;opacity:.9}
.hdm{background:var(--ouro);color:var(--escuro);font-weight:600;border-radius:999px;padding:8px 20px;white-space:nowrap;font-size:15px}
.nv{background:var(--escuro);border:0;margin:24px 28px 0;padding:0 8px;gap:0;overflow-x:auto;white-space:nowrap}
.nv .tb{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:#cfc9c2;font-size:15px;padding:16px 22px 13px}
.nv .tb:hover{color:#fff}
.nv .tb.on{background:none;color:var(--ouro);border-bottom-color:var(--ouro)}
.tb[data-v="vp"]:before{content:"📅 "}.tb[data-v="vi"]:before{content:"🗺️ "}.tb[data-v="vt"]:before{content:"📍 "}.tb[data-v="va"]:before{content:"⚙️ "}
.nv .sair{margin-left:auto;align-self:center;background:var(--cinza);color:#fff;border-radius:10px;padding:8px 16px;border:0;float:none}
.nv .sair:hover{color:#fff;opacity:.9}
#vi,#vp,#va{padding:20px 28px 40px;max-width:none}
#vt>.wrap{background:var(--card);margin:20px 28px 40px;border-radius:14px;border:1px solid var(--borda);box-shadow:0 2px 10px rgba(40,30,20,.06);padding:0 0 12px}
.iw,#pgt{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(40,30,20,.06)}
#pgt{max-width:1140px;margin-bottom:14px}#pgt:empty{display:none}.pgt1,.pgt2{max-width:1180px}
.iw{display:inline-block;max-width:100%}
.btn{border:1.5px solid var(--azul);color:var(--azul);background:#fff;border-radius:9px;padding:6px 14px;font-size:13px;font-weight:500}
.btn:hover{background:#eef3fb}
.btn.rd{border-color:#b3261e;color:#b3261e}.btn.rd.go{background:#b3261e;color:#fff}
.pgdl .btn{background:var(--verde);border-color:var(--verde);color:#fff}
.pgh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.pgh input{border:1.5px solid var(--borda);border-radius:9px;padding:6px 10px;background:#fff}
.pgt1{color:var(--cinza)}.pgt2{font-family:"Cormorant Garamond",Georgia,serif!important;font-size:30px;font-weight:600}
/* página do território */
th{background:var(--escuro);color:#f3eee8;border-color:#3a332c}
th.l{background:var(--escuro);color:#f3eee8}
th.l[style]{background:var(--escuro)!important}
.top td{background:var(--card)}
.top .ab{background:var(--verde);color:#fff;border:0;border-radius:10px 0 0 0;font-size:22px;letter-spacing:2px}

td.n{color:var(--marrom)}

function areaList(){return String(AREA==null?AREA0:AREA).split(/\n/).map(function(l){var p=l.split("=");return{jp:(p[0]||"").trim(),en:(p[1]||"").trim().toLowerCase().replace(/[^a-z]/g,"")};}).filter(function(a){return a.jp||a.en;});}
function inArea(jp,en){var Z=areaList();if(!Z.length)return true;var j=toHalf(un(jp)).replace(/\s/g,"");if(j)return Z.some(function(a){return a.jp&&j.indexOf(a.jp)>=0;});var e=un(en).toLowerCase();if(e)return Z.some(function(a){return a.en&&new RegExp("(^|[^a-z])"+a.en+"([^a-z]|$)").test(e);});return true;}
function toHalf(s){return String(s||"").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);});}
function town(jp,en){var s=toHalf(un(jp)),i=s.indexOf("区");if(s&&i>=0){s=s.slice(i+1).replace(/[一二三四五六七八九十]+丁目.*/,"");var m=/^[^\d\-−]+/.exec(s);return m?m[0].replace(/丁目$/,""):"";}
 s=un(en).toLowerCase().replace(/^[a-z]+-ku/,"").replace(/[^a-zāōū ]/g," ").replace(/\s+/g," ").trim();return s;}
function ward(jp,en){var s=toHalf(un(jp)),m=/([^県市\d]+?[区町村])/.exec(s.replace(/^.*?県/,"").replace(/^[^市]*市/,""));if(s&&m)return m[1];var e=/([a-z]+)-ku/.exec(un(en).toLowerCase());return e?"@"+e[1]:"";}
function cp(a,b){var n=0;while(n<a.length&&n<b.length&&a[n]===b[n])n++;return n;}
async function geo(q){q=toHalf(un(q)).trim();if(!q)return null;if(GEO[q]!==undefined)return GEO[q];try{var r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));var j=await r.json();GEO[q]=j&&j[0]?[j[0].geometry.coordinates[1],j[0].geometry.coordinates[0]]:null;}catch(e){GEO[q]=null;throw e;}return GEO[q];}
function km(a,b){var r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r,x=Math.pow(Math.sin(dl/2),2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.pow(Math.sin(dg/2),2);return 12742*Math.asin(Math.sqrt(x));}
